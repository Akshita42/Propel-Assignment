services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: propeldb
      POSTGRES_USER: propel
      POSTGRES_PASSWORD: propel
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U propel -d propeldb"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://propel:propel@db:5432/propeldb
      DATABASE_URL_SYNC: postgresql+psycopg2://propel:propel@db:5432/propeldb
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      APP_ENV: production
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./frontend/dist:/app/static:ro  # Mount built frontend
    restart: on-failure

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: on-failure

volumes:
  postgres_data:
