services:
  - type: web
    name: propel-fault-localizer
    env: python
    region: singapore
    plan: free
    buildCommand: "cd frontend && npm install --include=optional && npm run build && mkdir -p ../backend/static && cp -r dist/* ../backend/static/ && cd ../backend && pip install --upgrade pip setuptools wheel && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20.18.0
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./propel.db
      - key: APP_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
